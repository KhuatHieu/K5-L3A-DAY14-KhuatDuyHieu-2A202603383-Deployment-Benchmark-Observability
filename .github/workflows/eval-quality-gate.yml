# Exercise 7.3 — Quality gate: chạy eval trên golden dataset ở mỗi PR.
# run_eval.py thoát với exit code 1 khi accuracy < --min-accuracy hoặc có regression
# → step fail → job fail → đặt job này là "required status check" của branch main
#   (Settings → Branches → Branch protection) thì PR không merge được.
name: eval-quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        # MOCK_ERROR_RATE=0: lỗi upstream ngẫu nhiên không làm gate fail oan (flaky)
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          echo "agent did not start"; cat agent.log; exit 1

      - name: Eval + quality gate (accuracy >= 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log

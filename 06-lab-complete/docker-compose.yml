# ============================================================
# Agent + Redis bằng một lệnh:  docker compose up --build
# Secret (AGENT_API_KEY) đặt trong file .env (đã nằm trong .gitignore)
#   cp .env.example .env   # rồi sửa AGENT_API_KEY
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:

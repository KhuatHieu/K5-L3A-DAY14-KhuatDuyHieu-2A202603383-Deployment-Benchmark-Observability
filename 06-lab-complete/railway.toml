# ============================================================
# Railway — config as code (https://docs.railway.com/reference/config-as-code)
# Deploy:  cd 06-lab-complete && railway up
# Biến môi trường đặt trên Railway (KHÔNG ghi vào file này):
#   AGENT_API_KEY, REDIS_URL (tham chiếu service Redis: ${{Redis.REDIS_URL}}),
#   ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD
# PORT do Railway tự cấp — Dockerfile CMD đã lắng nghe theo ${PORT}.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

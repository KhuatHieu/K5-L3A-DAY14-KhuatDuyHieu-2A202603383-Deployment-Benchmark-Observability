# ============================================================
# Render Blueprint (https://render.com/docs/blueprint-spec)
# Dashboard → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
# Secret không ghi thẳng giá trị: AGENT_API_KEY do Render tự sinh (generateValue).
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []          # chỉ cho service nội bộ trên Render kết nối
